name: scheduled-tests

# schedule 事件只在仓库默认分支(12.x)触发，且读取的是默认分支上的本文件。
# 因此用 matrix.branch 显式 checkout 12.x / 13.x，让定时任务覆盖两个版本分支。
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  phpunit:
    name: phpunit / ${{ matrix.branch }} - PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: [12.x, 13.x]
        php: ['8.2', '8.3', '8.4', '8.5']
        exclude:
          - branch: 13.x
            php: '8.2' # Laravel 13 要求 PHP >= 8.3
    services:
      go-httpbin:
        image: mccutchen/go-httpbin
        ports:
          - 8080:8080

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: ${{ matrix.branch }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: scheduled-phpunit-${{ matrix.branch }}-php${{ matrix.php }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: scheduled-phpunit-${{ matrix.branch }}-php${{ matrix.php }}-composer-

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Run test
        run: composer test-all
        env:
          HTTPBIN_HOST: "http://localhost:8080"

  e2e:
    name: e2e / ${{ matrix.branch }} - PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: [12.x, 13.x]
        php: ['8.2', '8.3', '8.4', '8.5']
        exclude:
          - branch: 13.x
            php: '8.2' # Laravel 13 要求 PHP >= 8.3

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: ${{ matrix.branch }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: scheduled-e2e-${{ matrix.branch }}-php${{ matrix.php }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: scheduled-e2e-${{ matrix.branch }}-php${{ matrix.php }}-composer-

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Install e2e environment
        run: composer e2e:install

      - name: Run e2e test
        run: composer e2e:test
